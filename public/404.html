<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Page Not Found (404) | Redevise</title>
  <link rel="icon" type="image/svg+xml" href="/images/redevise.svg" />
  <style>
    body {
      background-color: #07090D;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .container {
      max-width: 600px;
      text-align: center;
    }
    .pill {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-family: monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(163, 230, 53, 0.1);
      color: #A3E635;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(163, 230, 53, 0.2);
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 1rem;
      color: #FFFFFF;
    }
    p {
      color: #94A3B8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    a {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.8125rem;
      font-family: monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: all 0.2s;
    }
    .primary {
      background: #A3E635;
      color: #07090D;
      font-weight: 600;
    }
    .secondary {
      background: #151A23;
      color: #E2E8F0;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .secondary:hover {
      border-color: #A3E635;
      color: #A3E635;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="pill">Error 404</div>
    <h1>We could not find that page</h1>
    <p>The page you are looking for does not exist or may have moved. Explore our core services, read the engineering blog, or head back to the homepage.</p>
    <div class="links">
      <a href="/" class="primary">Back to Homepage</a>
      <a href="/services" class="secondary">Services</a>
      <a href="/estimate" class="secondary">Estimator</a>
      <a href="/blog" class="secondary">Blog</a>
    </div>
  </div>
</body>

</html>
